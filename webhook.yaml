name: Daily Twisted Update

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Webhook Script
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.https://discord.com/api/webhooks/1519414358873084215/mVuJV8MofD1jDixl3Ex54ZvOoudjmZ2JJZaFsh6iGauN9Z0M7royq_fpPB_apD-6Iwom }}
      run: python bot.py
